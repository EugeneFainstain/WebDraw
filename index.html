<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Multi-Touch Drawing App</title>
</head>
<body>
    <div class="toolbar">
        <div class="toolbar-left">
            <div id="combinedPicker"></div>
            <button id="btnDup" class="dup-btn" aria-label="Duplicate">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
            </button>
            <button id="btnGroup" class="group-btn" aria-label="Group">
                <svg viewBox="28 80 152 128" width="32" height="32" fill="currentColor" stroke="currentColor" stroke-width="8">
                    <path fill="none" d="m 97.1,153.9 c 0,-4.7 3.8,-8.5 8.5,-8.5 h 29.6 c 4.7,0 8.5,3.8 8.5,8.5 v 16.9 c 0,4.7 -3.8,8.5 -8.5,8.5 h -29.6 c -4.7,0 -8.5,-3.8 -8.5,-8.5 z"/>
                    <path fill="none" d="m 67,131.6 c 0,-4.7 3.8,-8.5 8.5,-8.5 h 29.6 c 4.7,0 8.5,3.8 8.5,8.5 v 16.9 c 0,4.7 -3.8,8.5 -8.5,8.5 H 75.5 c -4.7,0 -8.5,-3.8 -8.5,-8.5 z"/>
                    <rect fill="none" stroke-width="7.8" width="118.5" height="101.5" x="46.1" y="97.5"/>
                    <circle stroke="none" cx="46.1" cy="97.7" r="10.7"/>
                    <circle stroke="none" cx="164.2" cy="97.6" r="10.7"/>
                    <circle stroke="none" cx="164.8" cy="199" r="10.7"/>
                    <circle stroke="none" cx="45.9" cy="199" r="10.7"/>
                </svg>
            </button>
            <button id="btnUngroup" class="ungroup-btn" aria-label="Ungroup">
                <svg viewBox="28 80 152 128" width="32" height="32" fill="currentColor" stroke="currentColor" stroke-width="8">
                    <path fill="none" d="m 110.36525,166.03276 c 0,-4.68312 3.78354,-8.46666 8.46666,-8.46666 h 29.63334 c 4.68312,0 8.46667,3.78354 8.46667,8.46666 v 16.93333 c 0,4.68313 -3.78355,8.46667 -8.46667,8.46667 h -29.63334 c -4.68312,0 -8.46666,-3.78354 -8.46666,-8.46667 z"/>
                    <path fill="none" d="m 53.526515,113.47346 c 0,-4.68312 3.783542,-8.46666 8.466667,-8.46666 h 29.633334 c 4.68312,0 8.466674,3.78354 8.466674,8.46666 v 16.93333 c 0,4.68313 -3.783554,8.46667 -8.466674,8.46667 H 61.993182 c -4.683125,0 -8.466667,-3.78354 -8.466667,-8.46667 z"/>
                </svg>
            </button>
            <button id="delBtn" class="del-btn" aria-label="Delete">
                <svg id="undoIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7v6h6"/>
                    <path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/>
                </svg>
                <svg id="deleteIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                </svg>
            </button>
        </div>
        <div class="toolbar-right">
            <div id="menuPicker"></div>
            <div id="iosFullscreenTooltip" class="ios-fullscreen-tooltip">
                <div class="tooltip-content">
                    <p>For fullscreen on iOS:</p>
                    <p>Tap <strong>Share</strong> <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> then <strong>"Add to Home Screen"</strong></p>
                    <button id="iosTooltipClose" class="tooltip-close">Got it</button>
                </div>
            </div>
        </div>
    </div>
    <div id="debugOverlay"></div>
    <canvas id="drawingCanvas"></canvas>
    <div id="cursorDiv"></div>
	<script type="module" src="src/app.ts"></script>
</body>
</html>
